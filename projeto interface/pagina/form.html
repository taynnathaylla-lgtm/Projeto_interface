<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Adoção</title>
    <link rel="stylesheet" href="../style/style4.css">
</head>
<body>

<h1>Formulário de Adoção </h1>

<form>

    <label>Nome completo:</label>
    <input type="text" required>

    <label>CPF:</label>
    <input type="text" required>

    <label>Telefone:</label>
    <input type="tel" required>

    <label>Email:</label>
    <input type="email" required>

    <label>Endereço:</label>
    <input type="text" placeholder="Rua, número, bairro" required>

    <label>Cidade:</label>
    <input type="text" required>

    <label>Estado:</label>
    <input type="text" required>

    <label>Tipo de moradia:</label>
    <select>
        <option>Casa</option>
        <option>Apartamento</option>
    </select>

    <label>Possui outros animais?</label>
    <select>
        <option>Não</option>
        <option>Sim</option>
    </select>

    <label>Comprovante de residência:</label>
    <input type="file">

    <br><br>

    <label>
        <input type="checkbox" required>
        Eu prometo cuidar bem do gatinho
    </label>

    <p>Você vai cuidar bem do gatinho? </p>
   
    <button class="btn-sim" type="submit">Sim</button>
    <button class="btn-sim" type="submit">Claro</button>
    
   
    <a href="../video/Entrou aqui pq então__20260415_121347_0000 (1).mp4">
    

        <button class="btn-nao" type="button">Acho que não</button>
    </a>

</form>

</body>
</html>
